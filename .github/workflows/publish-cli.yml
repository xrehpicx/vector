name: Publish CLI

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-cli.yml'
      - 'packages/vector-cli/**'
      - 'convex/_generated/api.d.ts'
      - 'convex/_shared/agentBridge.ts'
      - 'convex/agentBridge/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  publish-cli:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'cli-v')
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set publish metadata
        id: publish
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const eventName = process.env.GITHUB_EVENT_NAME;
          const path = 'packages/vector-cli/package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          let version;
          let npmTag;

          if (eventName === 'release') {
            const tagName = String(process.env.GITHUB_REF_NAME || '').replace(/^cli-v/, '');
            if (!/^\d+\.\d+\.\d+$/.test(tagName)) {
              throw new Error(`CLI release tag must be a stable semver like cli-v1.2.3. Received: ${tagName || '<empty>'}`);
            }
            version = tagName;
            npmTag = 'latest';
          } else {
            const baseVersion = String(pkg.version).trim();
            if (!/^\d+\.\d+\.\d+$/.test(baseVersion)) {
              throw new Error(`packages/vector-cli/package.json version must be a stable semver like 1.2.3. Received: ${baseVersion}`);
            }
            const runNumber = Number(process.env.GITHUB_RUN_NUMBER || '0');
            const runAttempt = Number(process.env.GITHUB_RUN_ATTEMPT || '1');
            version = `${baseVersion}-beta.${runNumber}.${runAttempt}`;
            npmTag = 'beta';
          }

          pkg.version = version;
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `npm_tag=${npmTag}\n`);
          NODE

      - name: Verify CLI
        env:
          VECTOR_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          pnpm run test:cli
          pnpm exec tsc --noEmit --pretty false
          pnpm run build:cli-package
          test "$(plutil -extract CFBundleShortVersionString raw packages/vector-cli/native/VectorMenuBar.app/Contents/Info.plist)" = "${{ steps.publish.outputs.version }}"
          npm pack --dry-run --json ./packages/vector-cli > /tmp/vector-cli-pack.json
          node -e "const p=require('/tmp/vector-cli-pack.json')[0]; if(!p.files.some(f=>f.path.endsWith('/MacOS/VectorMenuBar'))) process.exit(1)"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --tag "${{ steps.publish.outputs.npm_tag }}"
        working-directory: packages/vector-cli

      - name: Job summary
        run: |
          {
            echo "## CLI publish"
            echo
            echo "- Package: \`@rehpic/vcli\`"
            echo "- Version: \`${{ steps.publish.outputs.version }}\`"
            echo "- npm tag: \`${{ steps.publish.outputs.npm_tag }}\`"
            echo "- Trigger: \`${{ github.event_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
